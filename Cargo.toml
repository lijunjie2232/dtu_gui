[package]
name = "dtu_gui"
version = "0.2.0"
edition = "2021"
description = "dtu desktop client: a native egui window over dtu_core"

[[bin]]
name = "dtu-gui"
path = "src/main.rs"

[dependencies]
dtu_core = { git = "https://github.com/lijunjie2232/dtu_core.git", tag = "v0.1.2" }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
eframe = "0.29"
tray-icon = "0.26"
